[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-entry-engine"
version = "0.1.0"
description = "Modular XAUUSD signal research and OHLCV backtesting toolkit"
readme = "gold_entry_engine/README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6.0,<7",
]

[tool.setuptools.packages.find]
include = ["gold_entry_engine*"]

[tool.pytest.ini_options]
testpaths = ["gold_entry_engine/tests", "tests"]
